# ==============================================================================
# Prometheus - alvos coletados pela rede interna "monitoring"
# ==============================================================================
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # EntryPoint "metrics" do Traefik (:8082, não publicado no host)
  - job_name: traefik
    static_configs:
      - targets: ["traefik:8082"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  - job_name: alloy
    static_configs:
      - targets: ["alloy:12345"]

  # Telemetria interna do Jaeger v2
  - job_name: jaeger
    static_configs:
      - targets: ["jaeger:8888"]

  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]

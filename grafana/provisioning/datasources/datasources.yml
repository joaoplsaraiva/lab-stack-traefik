# ==============================================================================
# Data Sources provisionados automaticamente (nomes DNS internos do Docker)
# ==============================================================================
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      # Transforma o TraceId do access log do Traefik em link para o Jaeger
      derivedFields:
        - name: TraceID
          matcherRegex: '"TraceId"\s*:\s*"(\w+)"'
          datasourceUid: jaeger
          url: "$${__value.raw}"

  - name: Jaeger
    uid: jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686
    editable: false
